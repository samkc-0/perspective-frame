<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Photo Grid Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <h1>Photo Grid Overlay</h1>

      <div class="topbar">
        <input id="file" type="file" accept="image/*" />
        <button id="fitBtn" title="Re-fit image to the container">Fit</button>
        <button id="toggleBtn" title="Show/Hide grid">Grid: On</button>
      </div>

      <div class="stage">
        <canvas id="canvas"></canvas>
      </div>

      <p class="hint">
        Tip: On iPhone, add this page to your Home Screen to behave like an app.
        This prototype doesn’t upload anything — the photo stays local in your
        browser.
      </p>
    </div>

    <button
      class="drawer-toggle"
      id="drawerToggle"
      type="button"
      aria-controls="controls"
      aria-expanded="false"
    >
      Grid controls
    </button>

    <div class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-overlay" id="drawerOverlay"></div>
      <div class="drawer-panel" role="dialog" aria-labelledby="drawerTitle">
        <div class="drawer-header">
          <h2 id="drawerTitle">Grid controls</h2>
          <button id="drawerClose" class="drawer-close" type="button">
            Done
          </button>
        </div>
        <div class="controls" id="controls">
          <div class="row">
            <label for="spacing">Grid spacing</label>
            <input id="spacing" type="range" min="10" max="200" value="40" />
            <div class="value"><span id="spacingVal">40</span> px</div>
          </div>

          <div class="row">
            <label for="thickness">Line thickness</label>
            <input id="thickness" type="range" min="1" max="8" value="2" />
            <div class="value"><span id="thicknessVal">2</span> px</div>
          </div>

          <div class="row">
            <label for="opacity">Grid opacity</label>
            <input id="opacity" type="range" min="0" max="100" value="55" />
            <div class="value"><span id="opacityVal">55</span>%</div>
          </div>

          <div class="row">
            <label for="color">Grid color</label>
            <input id="color" type="color" value="#00ffcc" />
            <div class="value" style="opacity: 0.75">&nbsp;</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
