<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Perspective Frame</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="stage-shell">
        <div class="stage">
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="control-bar" id="control-bar">
      <div class="control-panel-container">
        <div class="control-panel active" id="spacing-panel">
          <div class="panel-header">
            <span>Grid spacing</span>
            <span class="value"><span id="spacing-value">40</span> px</span>
          </div>
          <input id="spacing" type="range" min="10" max="200" value="40" />
        </div>

        <div class="control-panel" id="thickness-panel">
          <div class="panel-header">
            <span>Line thickness</span>
            <span class="value"><span id="thickness-value">2</span> px</span>
          </div>
          <input id="thickness" type="range" min="1" max="8" value="2" />
        </div>

        <div class="control-panel" id="opacity-panel">
          <div class="panel-header">
            <span>Grid opacity</span>
            <span class="value"><span id="opacity-value">55</span>%</span>
          </div>
          <input id="opacity" type="range" min="0" max="100" value="55" />
        </div>

        <div class="control-panel" id="color-panel">
          <div class="panel-header">
            <span>Grid color</span>
            <span class="value">&nbsp;</span>
          </div>
          <input id="color" type="color" value="#000000" />
        </div>

        <div class="control-panel" id="block-panel">
          <div class="panel-header">
            <span>Color block detail</span>
            <span class="value">
              <span id="block-resolution-value">90</span>
              <span id="block-resolution-unit">cells</span>
            </span>
          </div>
          <input
            id="block-resolution"
            type="range"
            min="30"
            max="2000"
            value="90"
          />
        </div>
      </div>

      <div class="control-icons" role="tablist">
        <button
          class="control-icon active"
          data-panel="spacing-panel"
          aria-controls="spacing-panel"
          aria-label="Grid spacing"
        >
          <span class="sr-only">Grid spacing</span>
          <span aria-hidden="true">🌐</span>
        </button>
        <button
          class="control-icon"
          data-panel="thickness-panel"
          aria-controls="thickness-panel"
          aria-label="Line thickness"
        >
          <span class="sr-only">Line thickness</span>
          <span aria-hidden="true">🪮</span>
        </button>
        <button
          class="control-icon"
          data-panel="opacity-panel"
          aria-controls="opacity-panel"
          aria-label="Grid opacity"
        >
          <span class="sr-only">Grid opacity</span>
          <span aria-hidden="true">🫥</span>
        </button>
        <button
          class="control-icon color-picker-control"
          data-panel="color-panel"
          aria-controls="color-panel"
          aria-label="Grid color"
        >
          <span class="sr-only">Grid color</span>
          <span class="color-chip" aria-hidden="true"></span>
        </button>
        <button
          class="control-icon"
          data-panel="block-panel"
          aria-controls="block-panel"
          aria-label="Color block detail"
        >
          <span class="sr-only">Color block detail</span>
          <span aria-hidden="true">👾</span>
        </button>
      </div>

      <div class="control-actions">
        <input id="file" class="sr-only" type="file" accept="image/*" />
        <button
          type="button"
          id="upload-button"
          title="Load a photo from your device"
        >
          Load photo
        </button>
        <button id="toggle-grid-button" title="Show/Hide grid">Grid: On</button>
        <button
          id="toggle-posterize-button"
          title="Posterize colors for block-in practice"
        >
          Downsample: Off
        </button>
      </div>

      <button
        id="hide-controls"
        class="control-hide"
        type="button"
        title="Hide controls bar"
        aria-label="Hide controls bar"
      >
        Hide
      </button>
    </div>

    <button
      id="open-controls"
      class="control-open"
      type="button"
      aria-label="Show controls"
    >
      Menu
    </button>
    <script src="main.js"></script>
  </body>
</html>
